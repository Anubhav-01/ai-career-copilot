name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest)
        run: pytest tests -q --cov=app --cov-report=term-missing

  backend-postgres:
    name: Backend — integration (pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: career_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run migrations against pgvector
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/career_copilot_test
        run: alembic upgrade head
      - name: Verify schema + vector extension
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/career_copilot_test
        run: |
          python - <<'EOF'
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              tables = conn.execute(text(
                  "SELECT table_name FROM information_schema.tables"
                  " WHERE table_schema = 'public'"
              )).scalars().all()
              assert "embeddings" in tables, tables
              ext = conn.execute(text(
                  "SELECT extname FROM pg_extension WHERE extname = 'vector'"
              )).scalar()
              assert ext == "vector"
          print("pgvector schema OK:", sorted(tables))
          EOF

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build apps/api -t career-copilot-api:ci
      - name: Build web image
        run: docker build apps/web -t career-copilot-web:ci
